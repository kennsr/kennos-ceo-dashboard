<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KennOS — CEO Dashboard</title>
<style>
  :root{
    --plane:#f6f7f9;
    --card:#ffffff;
    --ink:#0f1115;
    --ink2:#5a6069;
    --muted:#8b909a;
    --grid:#e9ebef;
    --blue:#2a78d6;
    --blue-soft:#cfe1f8;
    --green:#0ca30c;
    --amber:#f0a516;
    --violet:#6b4ff0;
    --violet-soft:#e0d9fb;
    --red:#e0524d;
    --slate:#9aa1ac;
    --border:rgba(15,17,21,0.08);
    --shadow:0 1px 2px rgba(15,17,21,.04), 0 6px 20px rgba(15,17,21,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--plane);}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);line-height:1.45;padding:26px 22px 40px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .ttl{display:flex;align-items:center;gap:13px;}
  .ttl .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2a78d6,#6b4ff0);
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow);}
  h1{font-size:22px;font-weight:750;letter-spacing:-.02em;}
  .sub{font-size:12.5px;color:var(--ink2);}
  .pill{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--border);
    padding:7px 13px;border-radius:999px;box-shadow:var(--shadow);}
  .pill b{color:var(--green);}

  .row{display:grid;gap:16px;margin-bottom:16px;}
  .r4{grid-template-columns:repeat(4,1fr);}
  .r2{grid-template-columns:1.5fr 1fr;}
  .r2e{grid-template-columns:1fr 1fr;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .card h3{font-size:13px;font-weight:700;letter-spacing:.01em;margin-bottom:2px;}
  .card .cap{font-size:11.5px;color:var(--muted);margin-bottom:16px;}

  /* KPI */
  .kpi{position:relative;overflow:hidden;}
  .kpi .k-label{font-size:12px;color:var(--ink2);margin-bottom:9px;}
  .kpi .k-val{font-size:30px;font-weight:770;letter-spacing:-.03em;line-height:1;}
  .kpi .k-foot{font-size:11px;color:var(--muted);margin-top:8px;}
  .kpi .k-bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .kpi.g .k-bar{background:var(--green);} .kpi.b .k-bar{background:var(--blue);}
  .kpi.v .k-bar{background:var(--violet);} .kpi.s .k-bar{background:var(--slate);}

  /* banner */
  .banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#f4f0ff,#eef4fd);
    border:1px solid var(--violet-soft);border-radius:13px;padding:13px 18px;margin-bottom:16px;font-size:12.5px;color:var(--ink);}
  .banner b{color:var(--violet);}
  .banner .bic{font-size:16px;}

  /* horizontal bars */
  .hbars{display:flex;flex-direction:column;gap:13px;}
  .hb{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:12px;}
  .hb .nm{font-size:12.5px;font-weight:650;text-align:right;color:var(--ink);}
  .hb .tr{position:relative;height:24px;background:var(--grid);border-radius:7px;}
  .hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding:0 9px;}
  .hb .fl.c{background:linear-gradient(90deg,#2a78d6,#3f88e6);}
  .hb .fl.u{background:repeating-linear-gradient(135deg,#e0d9fb,#e0d9fb 7px,#f4f0ff 7px,#f4f0ff 14px);border:1.5px solid var(--violet);}
  .hb .fl.f{background:repeating-linear-gradient(135deg,#e9ebef,#e9ebef 7px,#f6f7f9 7px,#f6f7f9 14px);border:1.5px solid var(--slate);}
  .hb .fl.q{background:transparent;border:1.5px dashed var(--muted);justify-content:center;}
  .hb .v{font-size:11.5px;font-weight:750;}
  .hb .fl.c .v{color:#fff;} .hb .fl.u .v{color:var(--violet);} .hb .fl.f .v{color:var(--ink2);} .hb .fl.q .v{color:var(--muted);font-weight:650;}
  .lg{display:flex;gap:14px;margin-top:15px;font-size:11px;color:var(--ink2);flex-wrap:wrap;}
  .lg span{display:flex;align-items:center;gap:6px;}
  .sw{width:14px;height:11px;border-radius:3px;display:inline-block;}
  .sw.c{background:linear-gradient(90deg,#2a78d6,#3f88e6);}
  .sw.u{background:repeating-linear-gradient(135deg,#e0d9fb,#e0d9fb 4px,#f4f0ff 4px,#f4f0ff 8px);border:1.5px solid var(--violet);}
  .sw.f{background:repeating-linear-gradient(135deg,#e9ebef,#e9ebef 4px,#f6f7f9 4px,#f6f7f9 8px);border:1.5px solid var(--slate);}
  .sw.q{background:transparent;border:1.5px dashed var(--muted);}
  .foot-note{font-size:11px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--grid);}

  /* donut */
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut{flex-shrink:0;}
  .dleg{display:flex;flex-direction:column;gap:11px;}
  .dleg .li{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;font-size:12px;}
  .dleg .dot{width:11px;height:11px;border-radius:3px;}
  .dleg .amt{font-weight:750;font-variant-numeric:tabular-nums;}
  .dleg .nm{color:var(--ink2);}

  /* health grid */
  .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .hc{border:1px solid var(--border);border-radius:13px;padding:13px 14px;background:var(--card);border-top:3px solid var(--slate);}
  .hc.ok{border-top-color:var(--green);} .hc.wm{border-top-color:var(--amber);}
  .hc.rd{border-top-color:var(--blue);} .hc.un{border-top-color:var(--slate);}
  .hc.lt{border-top-color:var(--violet);}
  .hc.cl{border-top-color:#2a78d6;} .hc.cx{border-top-color:var(--red);} .hc.tm{border-top-color:#8b3a3a;}
  .hc .hn{font-size:14px;font-weight:730;display:flex;align-items:center;gap:6px;}
  .hc .hs{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .hc.ok .hs{color:var(--green);} .hc.wm .hs{color:#c67f00;} .hc.rd .hs{color:var(--blue);}
  .hc.un .hs{color:var(--muted);} .hc.lt .hs{color:var(--violet);}
  .hc.cl .hs{color:#2a78d6;} .hc.cx .hs{color:var(--red);} .hc.tm .hs{color:#8b3a3a;}
  .hc .hd{font-size:11.5px;color:var(--ink2);margin-top:7px;}

  /* meters */
  .mtr{display:flex;flex-direction:column;gap:13px;}
  .mrow .ml{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .mrow .ml .pc{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .mrow .bar{height:9px;background:var(--grid);border-radius:6px;overflow:hidden;}
  .mrow .fill{height:100%;border-radius:6px;}

  /* timeline */
  .tl{display:flex;flex-direction:column;}
  .ti{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:15px;position:relative;}
  .ti:not(:last-child)::before{content:"";position:absolute;left:6px;top:15px;bottom:0;width:2px;background:var(--grid);}
  .ti .dt{width:13px;height:13px;border-radius:50%;margin-top:3px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--border);}
  .ti .dt.a{background:var(--amber);} .ti .dt.b{background:var(--blue);} .ti .dt.c{background:var(--violet);} .ti .dt.d{background:var(--slate);}
  .ti .w{font-size:11px;color:var(--muted);}
  .ti .h{font-size:13px;font-weight:650;}
  .ti .h b{font-weight:800;}
  .ti .s{font-size:11px;color:var(--ink2);}
  .tl-sub{font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 10px;}

  /* lists */
  ol.fc{list-style:none;counter-reset:f;display:flex;flex-direction:column;gap:10px;}
  ol.fc li{counter-increment:f;display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12.5px;align-items:start;}
  ol.fc li::before{content:counter(f);background:var(--blue);color:#fff;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;margin-top:1px;}
  ul.au{list-style:none;display:flex;flex-direction:column;gap:9px;}
  ul.au li{font-size:12px;padding-left:15px;position:relative;color:var(--ink2);}
  ul.au li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--amber);}
  ul.au li b{color:var(--ink);font-weight:700;}

  .foot{text-align:center;font-size:10.5px;color:var(--muted);margin-top:26px;}
  .err{max-width:600px;margin:60px auto;text-align:center;color:var(--ink2);font-size:14px;}
  @media(max-width:820px){
    .r4{grid-template-columns:repeat(2,1fr);}
    .r2,.r2e{grid-template-columns:1fr;}
    .hg{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="err">Loading dashboard…</div>
</div>

<script>
async function loadDashboard(){
  const app = document.getElementById('app');
  let data;
  try{
    const res = await fetch('./data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    data = await res.json();
  }catch(e){
    app.innerHTML = '<div class="err">Couldn\'t load data.json (' + e.message + '). Make sure it sits next to index.html.</div>';
    return;
  }
  render(data);
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(d){
  const app = document.getElementById('app');

  const kpis = d.kpis.map(k => `
    <div class="card kpi ${esc(k.color)}"><div class="k-bar"></div>
      <div class="k-label">${esc(k.label)}</div>
      <div class="k-val">${esc(k.value)}</div>
      <div class="k-foot">${esc(k.foot)}</div>
    </div>`).join('');

  const banner = d.septemberBanner ? `<div class="banner"><span class="bic">📅</span> ${esc(d.septemberBanner.text)}</div>` : '';

  const bars = d.revenueBars.map(b => `
    <div class="hb"><div class="nm">${esc(b.name)}</div><div class="tr"><div class="fl ${esc(b.style)}" style="width:${b.widthPct}%"><span class="v">${esc(b.value)}</span></div></div></div>`).join('');

  const donutCircles = d.donut.slices.map(s => `
    <circle cx="66" cy="66" r="54" fill="none" stroke="${esc(s.color)}" stroke-width="22"
      stroke-dasharray="${esc(s.dasharray)}" stroke-dashoffset="${esc(s.dashoffset)}"></circle>`).join('');

  const donutLegend = d.donut.slices.map(s => `
    <div class="li"><span class="dot" style="background:${esc(s.color)}"></span><span class="nm">${esc(s.name)}</span><span class="amt">${esc(s.amount)}</span></div>`).join('');

  const health = d.campaigns.map(c => `
    <div class="hc ${esc(c.style)}"><div class="hn">${esc(c.icon)} ${esc(c.name)}</div><div class="hs">${esc(c.status)}</div><div class="hd">${esc(c.detail)}</div></div>`).join('');

  const progress = d.paymentProgress.map(p => `
    <div class="mrow"><div class="ml"><span>${esc(p.label)}</span><span class="pc">${p.pct}%</span></div><div class="bar"><div class="fill" style="width:${p.pct}%;background:${esc(p.color)}"></div></div></div>`).join('');

  const tlAug = d.timelineAugust.map(t => `
    <div class="ti"><div class="dt ${esc(t.dotClass)}"></div><div>
      <div class="w">${esc(t.window)}</div>
      <div class="h">${esc(t.headline)} &nbsp;<b>${esc(t.amount)}</b></div>
      <div class="s">${esc(t.sub)}</div></div></div>`).join('');

  const tlSep = d.timelineSeptember.map(t => `
    <div class="ti"><div class="dt ${esc(t.dotClass)}"></div><div>
      <div class="w">${esc(t.window)}</div>
      <div class="h">${esc(t.headline)} &nbsp;<b>${esc(t.amount)}</b></div>
      <div class="s">${esc(t.sub)}</div></div></div>`).join('');

  const focus = d.focus.map(f => `<li>${esc(f)}</li>`).join('');
  const audit = d.audit.map(a => `<li><b>${esc(a.b)}</b> ${esc(a.t)}</li>`).join('');

  app.innerHTML = `
  <div class="top">
    <div class="ttl">
      <div class="ic">📊</div>
      <div>
        <h1>${esc(d.meta.title)}</h1>
        <div class="sub">${esc(d.meta.subtitle)}</div>
      </div>
    </div>
    <div class="pill"><b>● Live &amp; synced</b> &nbsp;·&nbsp; Last SYNC ${esc(d.meta.lastSync)}</div>
  </div>

  <div class="row r4">${kpis}</div>

  ${banner}

  <div class="row r2">
    <div class="card">
      <h3>Revenue by campaign</h3>
      <div class="cap">USD · solid = settled · hatched violet = pending/forecast (Aug) · hatched grey = future (Sept) · dashed = TBD</div>
      <div class="hbars">${bars}</div>
      <div class="lg">
        <span><i class="sw c"></i> Settled/collected</span>
        <span><i class="sw u"></i> Pending / forecast (Aug)</span>
        <span><i class="sw f"></i> Future (Sept)</span>
        <span><i class="sw q"></i> Unknown / TBD</span>
      </div>
      <div class="foot-note"><b>Not charted:</b> ${esc(d.revenueNote)}</div>
    </div>

    <div class="card">
      <h3>Received to date — breakdown</h3>
      <div class="cap">Confirmed cash in hand</div>
      <div class="donut-wrap">
        <svg class="donut" width="132" height="132" viewBox="0 0 132 132">
          <g transform="rotate(-90 66 66)">
            <circle cx="66" cy="66" r="54" fill="none" stroke="#eef0f3" stroke-width="22"></circle>
            ${donutCircles}
          </g>
          <text x="66" y="62" text-anchor="middle" font-size="20" font-weight="800" fill="#0f1115">${esc(d.donut.totalLabel)}</text>
          <text x="66" y="80" text-anchor="middle" font-size="9.5" fill="#8b909a">${esc(d.donut.totalSub)}</text>
        </svg>
        <div class="dleg">${donutLegend}</div>
      </div>
      <div class="foot-note">${esc(d.donut.note)}</div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h3>Campaign health</h3>
      <div class="cap">Status across all ${d.campaigns.length} campaigns</div>
      <div class="hg">${health}</div>
    </div>
  </div>

  <div class="row r2e">
    <div class="card">
      <h3>Payment progress</h3>
      <div class="cap">Collected vs. expected, this cycle</div>
      <div class="mtr">${progress}</div>
      <div class="foot-note">${esc(d.paymentProgressNote)}</div>
    </div>

    <div class="card">
      <h3>Expected payments</h3>
      <div class="cap">August, then a look ahead to September</div>
      <div class="tl">${tlAug}</div>
      <div class="tl-sub">September (forecast)</div>
      <div class="tl">${tlSep}</div>
    </div>
  </div>

  <div class="row r2e">
    <div class="card">
      <h3>🎯 Current focus</h3>
      <div class="cap">This week's priorities</div>
      <ol class="fc">${focus}</ol>
    </div>
    <div class="card">
      <h3>🔍 Open questions / AUDIT</h3>
      <div class="cap">Clear each to reach fully Verified</div>
      <ul class="au">${audit}</ul>
    </div>
  </div>

  <div class="foot">${esc(d.footer)}</div>
  `;
}

loadDashboard();
</script>
</body>
</html>
